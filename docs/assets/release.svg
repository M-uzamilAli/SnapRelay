<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Mockup of a release: three screenshots pasted into the chat box, one kept in the queue because it was not confirmed">
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
    .bg{fill:#F4F4F5}.card{fill:#FFFFFF;stroke:#E4E4E7}.t{fill:#18181B}.m{fill:#71717A}.dv{stroke:#E4E4E7}
    .thumb{fill:#E4E4E7;stroke:#D4D4D8}.tl{fill:#A1A1AA}.bub{fill:#F4F4F5}.me{fill:#E0E7FF}.bl{fill:#D4D4D8}.mel{fill:#A5B4FC}
    .p{fill:#4F46E5}.on{fill:#FFFFFF}.ok{fill:#15803D}.wn{fill:#B45309}.cmp{fill:#FFFFFF;stroke:#D4D4D8}.x{fill:#52525B}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0F0F11}.card{fill:#18181B;stroke:#3F3F46}.t{fill:#F4F4F5}.m{fill:#A1A1AA}.dv{stroke:#3F3F46}
      .thumb{fill:#27272A;stroke:#3F3F46}.tl{fill:#52525B}.bub{fill:#27272A}.me{fill:#1E1B4B}.bl{fill:#3F3F46}.mel{fill:#4338CA}
      .p{fill:#818CF8}.on{fill:#0F0F11}.ok{fill:#4ADE80}.wn{fill:#FBBF24}.cmp{fill:#18181B;stroke:#52525B}.x{fill:#A1A1AA}
    }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="400" rx="16"/>

  <rect class="card" x="24" y="24" width="552" height="352" rx="12"/>
  <text class="m" x="48" y="49" font-size="12.5">Chat app (first target: ChatGPT)</text>
  <path d="M488 45 H498 M520 40 H530 V50 H520 Z M552 40 L562 50 M562 40 L552 50" stroke="#A1A1AA" stroke-width="1.2" fill="none"/>
  <line class="dv" x1="24" y1="64" x2="576" y2="64"/>

  <rect class="bub" x="48" y="84" width="300" height="48" rx="12"/>
  <rect class="bl" x="64" y="98" width="240" height="6" rx="3"/><rect class="bl" x="64" y="112" width="170" height="6" rx="3"/>
  <rect class="me" x="300" y="148" width="252" height="36" rx="12"/>
  <rect class="mel" x="316" y="163" width="200" height="6" rx="3"/>
  <rect class="bub" x="48" y="200" width="360" height="56" rx="12"/>
  <rect class="bl" x="64" y="214" width="310" height="6" rx="3"/><rect class="bl" x="64" y="228" width="280" height="6" rx="3"/><rect class="bl" x="64" y="242" width="120" height="6" rx="3"/>

  <rect class="cmp" x="48" y="272" width="504" height="88" rx="14"/>
  <g>
    <rect class="thumb" x="64" y="284" width="64" height="40" rx="6"/>
    <rect class="tl" x="72" y="292" width="36" height="4" rx="2"/><rect class="tl" x="72" y="301" width="46" height="4" rx="2"/><rect class="tl" x="72" y="310" width="26" height="4" rx="2"/>
    <circle class="x" cx="126" cy="286" r="7"/><path d="M123 283 L129 289 M129 283 L123 289" stroke="#FFFFFF" stroke-width="1.3"/>
  </g>
  <g>
    <rect class="thumb" x="140" y="284" width="64" height="40" rx="6"/>
    <rect class="tl" x="148" y="292" width="22" height="4" rx="2"/><rect class="tl" x="148" y="301" width="48" height="4" rx="2"/><rect class="mel" x="148" y="310" width="32" height="4" rx="2"/>
    <circle class="x" cx="202" cy="286" r="7"/><path d="M199 283 L205 289 M205 283 L199 289" stroke="#FFFFFF" stroke-width="1.3"/>
  </g>
  <g>
    <rect class="thumb" x="216" y="284" width="64" height="40" rx="6"/>
    <rect class="mel" x="224" y="291" width="18" height="26" rx="3"/><rect class="tl" x="248" y="292" width="24" height="10" rx="3"/><rect class="tl" x="248" y="306" width="24" height="10" rx="3"/>
    <circle class="x" cx="278" cy="286" r="7"/><path d="M275 283 L281 289 M281 283 L275 289" stroke="#FFFFFF" stroke-width="1.3"/>
  </g>
  <text class="m" x="296" y="309" font-size="12">← pasted by SnapRelay</text>
  <text class="m" x="64" y="346" font-size="13">Ask anything</text>
  <circle class="p" cx="528" cy="340" r="13"/>
  <path d="M528 346 V334 M523 339 L528 334 L533 339" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="card" x="600" y="24" width="256" height="272" rx="12"/>
  <rect class="p" x="616" y="40" width="24" height="24" rx="5"/>
  <rect class="on" x="621" y="47" width="14" height="10" rx="2"/>
  <text class="t" x="650" y="57" font-size="13" font-weight="600">SnapRelay</text>
  <text class="t" x="616" y="94" font-size="15" font-weight="600">Release finished</text>
  <text class="m" x="616" y="114" font-size="12.5">3 of 4 attached</text>
  <line class="dv" x1="616" y1="128" x2="840" y2="128"/>

  <text class="ok" x="616" y="152" font-size="13" font-weight="700">✓</text><text class="t" x="634" y="152" font-size="12.5">VS Code — attached</text>
  <text class="ok" x="616" y="178" font-size="13" font-weight="700">✓</text><text class="t" x="634" y="178" font-size="12.5">Terminal — attached</text>
  <text class="ok" x="616" y="204" font-size="13" font-weight="700">✓</text><text class="t" x="634" y="204" font-size="12.5">Figma — attached</text>
  <text class="wn" x="618" y="230" font-size="13" font-weight="700">!</text><text class="t" x="634" y="230" font-size="12.5">Chrome — not confirmed, kept</text>

  <rect class="p" x="616" y="248" width="120" height="32" rx="8"/>
  <text class="on" x="676" y="269" font-size="13" font-weight="600" text-anchor="middle">Retry Chrome</text>

  <text class="m" x="600" y="322" font-size="12">Nothing unconfirmed is ever</text>
  <text class="m" x="600" y="340" font-size="12">deleted. It waits in the queue.</text>
</svg>
