<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Mockup of the SnapRelay queue pop-up opened from the Windows tray">
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
    .bg{fill:#F4F4F5}.card{fill:#FFFFFF;stroke:#E4E4E7}.t{fill:#18181B}.m{fill:#71717A}.dv{stroke:#E4E4E7}
    .thumb{fill:#E4E4E7}.tl{fill:#A1A1AA}.p{fill:#4F46E5}.pl{fill:#C7D2FE}.on{fill:#FFFFFF}
    .task{fill:#E4E4E7}.ti{fill:#A1A1AA}.box{fill:#FFFFFF;stroke:#A1A1AA}
    .okbg{fill:#DCFCE7}.ok{fill:#15803D}.wnbg{fill:#FEF3C7}.wn{fill:#B45309}.nbg{fill:#F4F4F5}.n{fill:#52525B}
    .sec{fill:#FFFFFF;stroke:#D4D4D8}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0F0F11}.card{fill:#18181B;stroke:#3F3F46}.t{fill:#F4F4F5}.m{fill:#A1A1AA}.dv{stroke:#3F3F46}
      .thumb{fill:#27272A}.tl{fill:#52525B}.p{fill:#818CF8}.pl{fill:#3730A3}.on{fill:#0F0F11}
      .task{fill:#27272A}.ti{fill:#52525B}.box{fill:#18181B;stroke:#71717A}
      .okbg{fill:#052E16}.ok{fill:#4ADE80}.wnbg{fill:#451A03}.wn{fill:#FBBF24}.nbg{fill:#27272A}.n{fill:#D4D4D8}
      .sec{fill:#18181B;stroke:#52525B}
    }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="560" rx="16"/>

  <text class="t" x="40" y="64" font-size="20" font-weight="600">The queue pop-up</text>
  <text class="m" x="40" y="88" font-size="13">Mockup. Opens from the tray with Ctrl+Shift+Q.</text>

  <circle class="p" cx="52" cy="145" r="11"/><text class="on" x="52" y="149.5" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text class="t" x="74" y="150" font-size="14" font-weight="600">Previews, not copies</text>
  <text class="m" x="74" y="170" font-size="12.5">The pop-up only shows thumbnails. Each image</text>
  <text class="m" x="74" y="188" font-size="12.5">lives in one place, in memory, never on disk.</text>

  <circle class="p" cx="52" cy="225" r="11"/><text class="on" x="52" y="229.5" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text class="t" x="74" y="230" font-size="14" font-weight="600">Every screenshot has a status</text>
  <text class="m" x="74" y="250" font-size="12.5">Pending, attached, or not confirmed. Anything</text>
  <text class="m" x="74" y="268" font-size="12.5">not confirmed as attached stays in the queue.</text>

  <circle class="p" cx="52" cy="305" r="11"/><text class="on" x="52" y="309.5" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text class="t" x="74" y="310" font-size="14" font-weight="600">Release in one go</text>
  <text class="m" x="74" y="330" font-size="12.5">Sends the ticked screenshots into ChatGPT,</text>
  <text class="m" x="74" y="348" font-size="12.5">one paste at a time, checking each one.</text>

  <circle class="p" cx="52" cy="385" r="11"/><text class="on" x="52" y="389.5" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text class="t" x="74" y="390" font-size="14" font-weight="600">Lives in the tray</text>
  <text class="m" x="74" y="410" font-size="12.5">No window to manage. The tray icon shows</text>
  <text class="m" x="74" y="428" font-size="12.5">how many screenshots are waiting.</text>

  <rect class="card" x="500" y="32" width="348" height="436" rx="12"/>
  <path class="card" d="M804 467 L812 477 L820 467 Z" stroke="none"/>
  <text class="t" x="524" y="62" font-size="16" font-weight="600">SnapRelay</text>
  <text class="m" x="524" y="82" font-size="12">4 in queue · 3.1 MB of 64 MB</text>
  <path class="m" d="M818 56 L828 66 M828 56 L818 66" stroke="#71717A" stroke-width="1.5" stroke-linecap="round"/>
  <line class="dv" x1="500" y1="96" x2="848" y2="96"/>

  <g>
    <rect class="box" x="524" y="124" width="16" height="16" rx="4"/>
    <rect class="thumb" x="552" y="108" width="72" height="48" rx="6"/>
    <rect class="tl" x="560" y="118" width="40" height="4" rx="2"/><rect class="tl" x="560" y="128" width="52" height="4" rx="2"/><rect class="tl" x="560" y="138" width="30" height="4" rx="2"/>
    <text class="t" x="636" y="128" font-size="13" font-weight="600">VS Code</text>
    <text class="m" x="636" y="146" font-size="12">Region · 10:41</text>
    <rect class="okbg" x="742" y="121" width="86" height="22" rx="11"/>
    <text class="ok" x="785" y="136" font-size="11.5" font-weight="600" text-anchor="middle">✓ Attached</text>
  </g>
  <line class="dv" x1="524" y1="168" x2="828" y2="168"/>

  <g>
    <rect class="box" x="524" y="196" width="16" height="16" rx="4"/>
    <rect class="thumb" x="552" y="180" width="72" height="48" rx="6"/>
    <rect class="tl" x="552" y="180" width="72" height="9" rx="3"/>
    <rect class="tl" x="560" y="196" width="56" height="4" rx="2"/><rect class="tl" x="560" y="206" width="44" height="4" rx="2"/><rect class="tl" x="560" y="216" width="50" height="4" rx="2"/>
    <text class="t" x="636" y="200" font-size="13" font-weight="600">Chrome</text>
    <text class="m" x="636" y="218" font-size="12">Quick · 10:42</text>
    <rect class="wnbg" x="710" y="193" width="118" height="22" rx="11"/>
    <text class="wn" x="769" y="208" font-size="11.5" font-weight="600" text-anchor="middle">! Not confirmed</text>
  </g>
  <line class="dv" x1="524" y1="240" x2="828" y2="240"/>

  <g>
    <rect class="p" x="524" y="268" width="16" height="16" rx="4"/>
    <path d="M528 276 L531 279 L536 272" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="thumb" x="552" y="252" width="72" height="48" rx="6"/>
    <rect class="tl" x="560" y="262" width="24" height="4" rx="2"/><rect class="tl" x="560" y="272" width="56" height="4" rx="2"/><rect class="pl" x="560" y="282" width="36" height="4" rx="2"/>
    <text class="t" x="636" y="272" font-size="13" font-weight="600">Terminal</text>
    <text class="m" x="636" y="290" font-size="12">Region · 10:43</text>
    <rect class="nbg" x="748" y="265" width="80" height="22" rx="11"/>
    <text class="n" x="788" y="280" font-size="11.5" font-weight="600" text-anchor="middle">○ Pending</text>
  </g>
  <line class="dv" x1="524" y1="312" x2="828" y2="312"/>

  <g>
    <rect class="p" x="524" y="340" width="16" height="16" rx="4"/>
    <path d="M528 348 L531 351 L536 344" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="thumb" x="552" y="324" width="72" height="48" rx="6"/>
    <rect class="pl" x="562" y="332" width="22" height="30" rx="3"/><rect class="tl" x="590" y="334" width="26" height="12" rx="3"/><rect class="tl" x="590" y="350" width="26" height="12" rx="3"/>
    <text class="t" x="636" y="344" font-size="13" font-weight="600">Figma</text>
    <text class="m" x="636" y="362" font-size="12">Region · 10:44</text>
    <rect class="nbg" x="748" y="337" width="80" height="22" rx="11"/>
    <text class="n" x="788" y="352" font-size="11.5" font-weight="600" text-anchor="middle">○ Pending</text>
  </g>
  <line class="dv" x1="500" y1="384" x2="848" y2="384"/>

  <rect class="sec" x="524" y="400" width="96" height="36" rx="8"/>
  <text class="t" x="572" y="423" font-size="13" text-anchor="middle">Clear all</text>
  <rect class="p" x="632" y="400" width="196" height="36" rx="8"/>
  <text class="on" x="730" y="423" font-size="13" font-weight="600" text-anchor="middle">Release selected (2)</text>
  <text class="m" x="524" y="456" font-size="11">Win+Shift+A region   ·   Win+Shift+Z quick</text>

  <circle class="p" cx="552" cy="108" r="10"/><text class="on" x="552" y="112" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <circle class="p" cx="828" cy="193" r="10"/><text class="on" x="828" y="197" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <circle class="p" cx="828" cy="400" r="10"/><text class="on" x="828" y="404" font-size="11" font-weight="700" text-anchor="middle">3</text>

  <rect class="task" x="0" y="500" width="880" height="60"/>
  <rect class="bg" x="0" y="544" width="880" height="16" rx="0" opacity="0"/>
  <rect class="ti" x="728" y="522" width="16" height="16" rx="3"/>
  <rect class="ti" x="756" y="522" width="16" height="16" rx="3"/>
  <rect class="p" x="796" y="514" width="32" height="32" rx="6"/>
  <rect class="on" x="804" y="524" width="16" height="12" rx="2"/>
  <circle class="p" cx="812" cy="530" r="3"/>
  <circle class="wn" cx="826" cy="516" r="8"/><text class="on" x="826" y="519.5" font-size="10" font-weight="700" text-anchor="middle">4</text>
  <text class="m" x="866" y="534" font-size="12" text-anchor="end">10:44</text>
  <circle class="p" cx="790" cy="508" r="10"/><text class="on" x="790" y="512" font-size="11" font-weight="700" text-anchor="middle">4</text>
</svg>
