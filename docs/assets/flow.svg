<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-label="SnapRelay flow: capture, queue, switch, release">
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
    .bg{fill:#F4F4F5}.card{fill:#FFFFFF;stroke:#E4E4E7}.t{fill:#18181B}.m{fill:#71717A}
    .ln{stroke:#A1A1AA;fill:none}.soft{fill:#E4E4E7}.p{fill:#4F46E5}.ps{stroke:#4F46E5;fill:none}
    .chip{fill:#EEF2FF}.chipt{fill:#3730A3}.ok{fill:#15803D}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0F0F11}.card{fill:#18181B;stroke:#3F3F46}.t{fill:#F4F4F5}.m{fill:#A1A1AA}
      .ln{stroke:#71717A}.soft{fill:#3F3F46}.p{fill:#818CF8}.ps{stroke:#818CF8}
      .chip{fill:#1E1B4B}.chipt{fill:#C7D2FE}.ok{fill:#4ADE80}
    }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="262" rx="16"/>

  <g>
    <rect class="card" x="24" y="30" width="184" height="212" rx="12"/>
    <rect class="ps" x="80" y="56" width="72" height="48" rx="4" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect class="p" x="76" y="52" width="8" height="8" rx="2"/><rect class="p" x="148" y="52" width="8" height="8" rx="2"/>
    <rect class="p" x="76" y="100" width="8" height="8" rx="2"/><rect class="p" x="148" y="100" width="8" height="8" rx="2"/>
    <text class="m" x="44" y="138" font-size="11">Step 1</text>
    <text class="t" x="44" y="160" font-size="16" font-weight="600">Capture</text>
    <text class="m" x="44" y="182" font-size="12.5">Grab a region or the</text>
    <text class="m" x="44" y="199" font-size="12.5">whole screen, any app.</text>
    <rect class="chip" x="44" y="212" width="112" height="22" rx="11"/>
    <text class="chipt" x="100" y="227" font-size="11.5" text-anchor="middle">Win+Shift+A / Z</text>
  </g>

  <path class="ln" d="M212 136 H232 M226 130 L232 136 L226 142" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect class="card" x="240" y="30" width="184" height="212" rx="12"/>
    <rect class="soft" x="300" y="52" width="64" height="40" rx="4"/>
    <rect class="soft" x="292" y="60" width="64" height="40" rx="4" opacity=".8"/>
    <rect class="p" x="284" y="68" width="64" height="40" rx="4"/>
    <rect class="soft" x="360" y="96" width="22" height="16" rx="8"/>
    <text class="t" x="371" y="108" font-size="10.5" text-anchor="middle" font-weight="600">4</text>
    <text class="m" x="260" y="138" font-size="11">Step 2</text>
    <text class="t" x="260" y="160" font-size="16" font-weight="600">Queue</text>
    <text class="m" x="260" y="182" font-size="12.5">Held in memory only.</text>
    <text class="m" x="260" y="199" font-size="12.5">Nothing saved to disk.</text>
    <rect class="chip" x="260" y="212" width="96" height="22" rx="11"/>
    <text class="chipt" x="308" y="227" font-size="11.5" text-anchor="middle">Ctrl+Shift+Q</text>
  </g>

  <path class="ln" d="M428 136 H448 M442 130 L448 136 L442 142" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect class="card" x="456" y="30" width="184" height="212" rx="12"/>
    <rect class="soft" x="494" y="58" width="52" height="40" rx="4"/>
    <rect class="p" x="566" y="58" width="52" height="40" rx="4"/>
    <path class="ln" d="M550 78 H560 M555 73 L560 78 L555 83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="m" x="476" y="138" font-size="11">Step 3</text>
    <text class="t" x="476" y="160" font-size="16" font-weight="600">Switch</text>
    <text class="m" x="476" y="182" font-size="12.5">Open your ChatGPT</text>
    <text class="m" x="476" y="199" font-size="12.5">chat when you're ready.</text>
    <rect class="chip" x="476" y="212" width="80" height="22" rx="11"/>
    <text class="chipt" x="516" y="227" font-size="11.5" text-anchor="middle">You, once</text>
  </g>

  <path class="ln" d="M644 136 H664 M658 130 L664 136 L658 142" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect class="card" x="672" y="30" width="184" height="212" rx="12"/>
    <rect class="soft" x="712" y="52" width="104" height="58" rx="10"/>
    <rect class="p" x="722" y="62" width="30" height="22" rx="3"/>
    <rect class="p" x="758" y="62" width="30" height="22" rx="3"/>
    <circle class="ok" cx="806" cy="98" r="9"/>
    <path d="M802 98 L805 101 L810 95" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="m" x="692" y="138" font-size="11">Step 4</text>
    <text class="t" x="692" y="160" font-size="16" font-weight="600">Release</text>
    <text class="m" x="692" y="182" font-size="12.5">Pasted in one by one,</text>
    <text class="m" x="692" y="199" font-size="12.5">each paste checked.</text>
    <rect class="chip" x="692" y="212" width="112" height="22" rx="11"/>
    <text class="chipt" x="748" y="227" font-size="11.5" text-anchor="middle">Release key (TBD)</text>
  </g>
</svg>
