[package]
name = "snaprelay"
version = "0.1.0"
edition = "2021"
description = "Capture screenshots anywhere, queue them in memory, release them into an AI chat."

[dependencies]
png = "0.17"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# Our own code stays easy to debug; libraries (PNG compression) are compiled
# optimized even in test builds, which makes capture and release much faster.
[profile.dev.package."*"]
opt-level = 3
